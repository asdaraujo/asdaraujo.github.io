<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
<title>Quick Links</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link href="css/app.css" rel="stylesheet">
</head>
<body>

  <div class="bg-luminosity-overlay" id="bg-luminosity-overlay"></div>

  <div class="panel">
    <h1 id="page-title">Quick Links</h1>
    <ul class="link-list" id="link-list">
      <!-- Links are injected here from configuration -->
    </ul>
    <div class="status-message" id="status-message"></div>
  </div>

  <div class="attribution" id="attribution"></div>

  <div class="modal-overlay" id="image-modal-overlay">
    <img id="image-modal-img" src="" alt="">
    <div class="modal-close">&times;</div>
  </div>

  <div class="modal-overlay" id="message-modal-overlay">
    <span id="message-modal-text"></span>
    <div class="modal-close">&times;</div>
  </div>

  <button class="configs-btn" id="configs-gear-btn" title="Configs" aria-label="Configs">&#9881;</button>

  <div class="modal-overlay" id="configs-modal-overlay">
    <div class="configs-panel" id="configs-panel">
      <ul class="configs-listbox" id="configs-listbox">
        <!-- Items are injected here -->
      </ul>
      <div class="configs-add-row">
        <input type="text" id="configs-new-item" placeholder="Add item…" autocomplete="off">
        <button id="configs-add-btn" disabled>+</button>
      </div>
    </div>
    <div class="modal-close">&times;</div>
    <button class="share-btn" id="share-btn" title="Share" aria-label="Share"><img src="icons/share-white.svg" alt="Share" width="24" height="24"></button>
    <button class="configs-btn" id="refresh-btn" title="Refresh" aria-label="Refresh">&#8635;</button>
  </div>

<script src="./lib/app-state.js"></script>
<script src="./lib/app.js"></script>

</body>
</html>
