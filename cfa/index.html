<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
<title>Quick Links</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --text-color: #f00;
    --accent: #ffffff;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
  }

  body {
    font-family: 'Roboto', -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background-color: #333;
    background-image: var(--bg-image, none);
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 5px 10px;
  }

  .bg-luminosity-overlay {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }

  .panel {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 520px;
    padding: 0;
  }

  h1 {
    text-align: center;
    margin: 0 0 12px;
    font-family: 'Roboto', sans-serif;
    font-weight: 700;
    font-size: 36px;
    letter-spacing: 0.02em;
    color: var(--text-color);
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.4);
  }

  ul.link-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  ul.link-list li a {
    display: flex;
    align-items: center;
    gap: 16px;
    text-align: left;
    text-decoration: none;
    color: var(--text-color);
    font-family: 'Roboto', sans-serif;
    font-weight: 400;
    font-size: 30px;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.4);
    transition: opacity 0.15s ease, transform 0.15s ease;
    margin: 5px 0;
  }

  ul.link-list li a.is-hovered {
    opacity: 0.75;
    transform: translateX(4px);
  }

  div.panel.offline ul.link-list a.not-cached {
    opacity: 0.5;
  }

  ul.link-list li a .icon {
    flex: 0 0 auto;
    font-size: 1em;
    line-height: 1;
    width: 1.1em;
    text-align: center;
  }

  ul.link-list li a .icon img {
    width: 1em;
    height: 1em;
    display: block;
    object-fit: contain;
  }

  ul.link-list li a .text {
    flex: 1 1 auto;
  }

  .status-message {
    text-align: center;
    color: #ffb4b4;
    font-family: 'Roboto', sans-serif;
    font-size: 0.95rem;
    margin-top: 16px;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.4);
  }

  .attribution {
    position: fixed;
    left: 12px;
    bottom: 10px;
    font-family: 'Roboto', sans-serif;
    font-size: 11px;
    color: rgba(255, 255, 255, 0.85);
    text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
    z-index: 10;
  }

  .attribution a {
    color: inherit;
    text-decoration: underline;
  }

  .attribution a:hover {
    color: #ffffff;
  }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.85);
    display: none;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 100;
    padding: 24px;
  }

  .modal-overlay.open {
    display: flex;
    flex-direction: column;
    gap: 50px;
  }

  .modal-overlay img {
    max-width: 90vw;
    max-height: 90vh;
    object-fit: contain;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
  }

  .modal-close {
    font-family: 'Roboto', sans-serif;
    font-size: 60px;
    line-height: 1;
    color: rgba(255, 255, 255, 0.5);
    opacity: .5;
    user-select: none;
  }

  .modal-overlay span {
    font-family: 'Roboto', -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 30px;
    text-align: center;
    color: rgba(255, 255, 255, 0.85);
    text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
  }

  .settings-btn {
    position: fixed;
    right: 14px;
    bottom: 12px;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: none;
    background: rgba(0, 0, 0, 0.4);
    color: rgba(255, 255, 255, 0.85);
    font-size: 18px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 20;
    transition: background 0.15s ease, transform 0.2s ease;
  }

  .settings-btn:hover {
    background: rgba(0, 0, 0, 0.6);
    transform: rotate(25deg);
  }

  #settings-modal-overlay.open {
    gap: 20px;
    cursor: default;
  }

  .settings-panel {
    width: 100%;
    max-width: 360px;
    max-height: 75vh;
    background: #1e1f24;
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    cursor: default;
  }

  .settings-listbox {
    list-style: none;
    margin: 0;
    padding: 0;
    overflow-y: auto;
    flex: 1 1 auto;
  }

  .settings-empty {
    padding: 20px 16px;
    text-align: center;
    font-family: 'Roboto', sans-serif;
    font-size: 14px;
    color: rgba(255, 255, 255, 0.5);
  }

  .settings-item {
    position: relative;
    overflow: hidden;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  }

  .settings-item-delete {
    position: absolute;
    inset: 0 0 0 auto;
    width: 84px;
    border: none;
    background: #c0392b;
    color: #ffffff;
    font-family: 'Roboto', sans-serif;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
  }

  .settings-item-content {
    position: relative;
    background: #1e1f24;
    padding: 14px 16px;
    font-family: 'Roboto', sans-serif;
    font-size: 16px;
    color: #f2f2f2;
    display: flex;
    align-items: center;
    gap: 10px;
    transition: transform 0.2s ease;
    touch-action: pan-y;
    user-select: none;
    cursor: pointer;
  }

  .settings-item-tick {
    flex: 0 0 auto;
    width: 18px;
    color: #2ecc71;
    font-size: 16px;
    text-align: center;
  }

  .settings-item-text {
    flex: 1 1 auto;
  }

  .settings-add-row {
    display: flex;
    gap: 8px;
    padding: 12px;
    background: #1e1f24;
    border-top: 1px solid rgba(255, 255, 255, 0.08);
  }

  .settings-add-row input {
    flex: 1 1 auto;
    min-width: 0;
    padding: 10px 12px;
    font-family: 'Roboto', sans-serif;
    font-size: 15px;
    background: #2a2c33;
    color: #f2f2f2;
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 8px;
  }

  .settings-add-row input::placeholder {
    color: rgba(255, 255, 255, 0.4);
  }

  .settings-add-row button {
    flex: 0 0 auto;
    width: 44px;
    height: 44px;
    border-radius: 8px;
    border: none;
    background: #3a6df0;
    color: #ffffff;
    font-size: 22px;
    line-height: 1;
    cursor: pointer;
  }

  .settings-add-row button:disabled {
    background: #454858;
    color: rgba(255, 255, 255, 0.4);
    cursor: not-allowed;
  }
</style>
</head>
<body>

  <div class="bg-luminosity-overlay" id="bg-luminosity-overlay"></div>

  <div class="panel">
    <h1 id="page-title">Quick Links</h1>
    <ul class="link-list" id="link-list">
      <!-- Links are injected here from configuration -->
    </ul>
    <div class="status-message" id="status-message"></div>
  </div>

  <div class="attribution" id="attribution"></div>

  <div class="modal-overlay" id="image-modal-overlay">
    <img id="image-modal-img" src="" alt="">
    <div class="modal-close">&times;</div>
  </div>

  <div class="modal-overlay" id="message-modal-overlay">
    <span id="message-modal-text"></span>
    <div class="modal-close">&times;</div>
  </div>

  <button class="settings-btn" id="settings-gear-btn" title="Settings" aria-label="Settings">&#9881;</button>

  <div class="modal-overlay" id="settings-modal-overlay">
    <div class="settings-panel" id="settings-panel">
      <ul class="settings-listbox" id="settings-listbox">
        <!-- Items are injected here -->
      </ul>
      <div class="settings-add-row">
        <input type="text" id="settings-new-item" placeholder="Add item…" autocomplete="off">
        <button id="settings-add-btn" disabled>+</button>
      </div>
    </div>
    <div class="modal-close" id="settings-close-btn">&times;</div>
    <button class="settings-btn" id="settings-refresh-btn" title="Refresh cache" aria-label="Refresh cache">&#8635;</button>
  </div>

<script src="./lib/app-state.js"></script>
<script>
  const CACHE_NAME = 'static-cache-v1';
  const QUERY_STRING = window.location.search;
  //const URL_PARAMS = new URLSearchParams(QUERY_STRING);
  const CONFIG_DIR = 'configs';
  const DEFAULT_CONFIG_NAME = 'basic';

  function isImageIcon(icon) {
    return /^https?:\/\//i.test(icon) || /\.(png|jpe?g|svg|gif|webp)$/i.test(icon);
  }

  function getFaviconUrl(pageUrl) {
    try {
      const domain = new URL(pageUrl).hostname;
      return `https://www.google.com/s2/favicons?domain=${encodeURIComponent(domain)}&sz=64`;
    } catch (err) {
      return "";
    }
  }

  function buildIconMarkup(icon, url) {
    const hasIcon = icon !== null && icon !== undefined && String(icon).trim() !== "";

    if (!hasIcon) {
      const favicon = getFaviconUrl(url);
      return favicon ? `<img src="${favicon}" alt="" loading="lazy">` : "";
    }

    if (isImageIcon(icon)) {
      return `<img src="${icon}" alt="" loading="lazy">`;
    }
    // Treat as emoji / text glyph
    return icon;
  }

  function openImageModal(url) {
    const overlay = document.getElementById("image-modal-overlay");
    const img = document.getElementById("image-modal-img");
    img.src = url;
    overlay.classList.add("open");
  }

  function closeImageModal() {
    const overlay = document.getElementById("image-modal-overlay");
    const img = document.getElementById("image-modal-img");
    overlay.classList.remove("open");
    img.src = "";
  }

  function openMessageModal(text) {
    const overlay = document.getElementById("message-modal-overlay");
    const span = document.getElementById("message-modal-text");
    span.innerHTML = text;
    overlay.classList.add("open");
  }

  function closeMessageModal() {
    const overlay = document.getElementById("message-modal-overlay");
    overlay.classList.remove("open");
  }

  async function isResourceCached(resourceUrl) {
    const absoluteUrl = new URL(resourceUrl, document.baseURI);
    const cache = await caches.open(CACHE_NAME);

    // Get all Request objects in this cache
    const requests = await cache.keys();

    return requests.some(request => request.url == absoluteUrl);
  }

  function refreshLinks() {
    appState.get('offline').then((isOffline) => {
      for (e of document.getElementsByClassName('panel')) {
        if (isOffline) {
          e.classList.add('offline');
        } else {
          e.classList.remove('offline');
        }
      }
    });
  }

  function setOnlineMode() {
    appState.set('offline', false).then(() => refreshLinks());
  }

  function setOfflineMode() {
    appState.set('offline', true).then(() => refreshLinks());
    ping();
  }

  function ping() {
    const pingFreqMs = 1000;
    const timeoutMs = 3000;
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), timeoutMs);
    //const pingUrl = 'http://asdaraujo.github.io/cfa/'; // for test only
    const pingUrl = 'ping';
    fetch(pingUrl, { method: 'HEAD', signal: controller.signal }).then((result) => {
      setOnlineMode();
    }).catch(() => {
      setTimeout(ping, pingFreqMs);
    }).finally(() => {
      clearTimeout(timeout);
    });
  }
  document.getElementById("image-modal-overlay").addEventListener("click", closeImageModal);
  document.getElementById("message-modal-overlay").addEventListener("click", closeMessageModal);

  async function handleLinkClick(event, url) {
    const link = event.currentTarget;
    event.preventDefault();

    // restore state of the link
    link.classList.remove('is-hovered'); // clear immediately, don't wait for mouseleave

    const timeoutMs = 5000;
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), timeoutMs);

    let isImage = false;
    let isReachable = false;
    let msg = '';
    try {
      const res = await fetch(url, { method: "HEAD", mode: 'no-cors', signal: controller.signal });
      isReachable = true;
      if (link.classList.contains('not-cached')) {
        setOnlineMode();
      }
      const contentType = res.headers.get("Content-Type") || "";
      isImage = contentType.toLowerCase().startsWith("image/");
    } catch (err) {
      // HEAD request failed (e.g. blocked by CORS, or the server doesn't support it).
      // Fall back to treating it as a normal link.
      isImage = false;
      isReachable = false;
      setOfflineMode();
      msg = 'Error: ' + err.message;
    } finally {
      clearTimeout(timeout);
    }

    if (!isReachable) {
      openMessageModal("It seems you're offline.<br/>Try again later.<br/>" + msg);
    } else if (isImage) {
      openImageModal(url);
    } else {
      window.open(url, link.target, "noopener,noreferrer");
    }
  }

  function renderLinks(links) {
    const list = document.getElementById("link-list");
    list.innerHTML = "";

    links.forEach(({ text, url, icon, target }) => {
      const li = document.createElement("li");
      const a = document.createElement("a");
      a.href = url;
      if (target === undefined || target === null)
        a.target = "_blank";
      else
        a.target = target;
      a.rel = "noopener noreferrer";
      a.addEventListener('click', (event) => handleLinkClick(event, url));
      a.addEventListener('mouseenter', () => a.classList.add('is-hovered'));
      a.addEventListener('mouseleave', () => a.classList.remove('is-hovered'));

      isResourceCached(url)
        .then((isCached) => {
          if (!isCached) {
            a.classList.add('not-cached');
          }
        });

      const iconSpan = document.createElement("span");
      iconSpan.className = "icon";
      iconSpan.innerHTML = buildIconMarkup(icon, url);

      const textSpan = document.createElement("span");
      textSpan.className = "text";
      textSpan.textContent = text;

      a.appendChild(iconSpan);
      a.appendChild(textSpan);
      li.appendChild(a);
      list.appendChild(li);
    });
  }

  function setTitle(title) {
    if (title) {
      document.title = title;
      const titleElem = document.getElementById("page-title");
      titleElem.innerHTML = title;
    }
  }

  function applyBackground(imageUrl) {
    if (imageUrl) {
      document.body.style.setProperty("--bg-image", `url("${imageUrl}")`);
    }
  }

  function applyLuminosity(luminosity) {
    const overlay = document.getElementById("bg-luminosity-overlay");
    const value = Number(luminosity);

    if (!Number.isFinite(value) || value === 0) {
      overlay.style.backgroundColor = "transparent";
      return;
    }

    // Clamp to the supported range.
    const clamped = Math.max(-1, Math.min(1, value));
    const color = clamped < 0 ? "0, 0, 0" : "255, 255, 255";
    const opacity = Math.abs(clamped);

    overlay.style.backgroundColor = `rgba(${color}, ${opacity})`;
  }

  function renderAttributionMarkup(name, profileUrl, photoUrl, unsplashUrl) {
    const el = document.getElementById("attribution");
    if (!name) {
      el.innerHTML = "";
      return;
    }
    const nameLink = profileUrl
      ? `<a href="${profileUrl}" target="_blank" rel="noopener noreferrer">${name}</a>`
      : name;
    const unsplashLink = unsplashUrl
      ? `<a href="${unsplashUrl}" target="_blank" rel="noopener noreferrer">Unsplash</a>`
      : "Unsplash";
    el.innerHTML = `Photo by ${nameLink} on ${unsplashLink}`;
  }

  async function loadAttribution(attribution) {
    if (!attribution) return;

    const { unsplashAccessKey, unsplashPhotoId, photographerName, photographerUrl, photoUrl, unsplashUrl } = attribution;

    // If an Unsplash API access key + photo ID are configured, fetch live data
    // directly from the Unsplash API so credit always reflects Unsplash's current record.
    if (unsplashAccessKey && unsplashPhotoId) {
      try {
        const res = await fetch(
          `https://api.unsplash.com/photos/${unsplashPhotoId}?client_id=${unsplashAccessKey}`
        );
        if (!res.ok) throw new Error(`Unsplash API error: ${res.status}`);
        const data = await res.json();

        const name = data?.user?.name;
        const profileUrl = data?.user?.links?.html
          ? `${data.user.links.html}?utm_source=quick_links_app&utm_medium=referral`
          : photographerUrl;
        const liveePhotoUrl = data?.links?.html
          ? `${data.links.html}?utm_source=quick_links_app&utm_medium=referral`
          : photoUrl;

        renderAttributionMarkup(name, profileUrl, liveePhotoUrl, unsplashUrl);

        // Per Unsplash API guidelines, notify them the photo was used ("hotlinked" download trigger).
        if (data?.links?.download_location) {
          fetch(`${data.links.download_location}&client_id=${unsplashAccessKey}`).catch(() => {});
        }
        return;
      } catch (err) {
        console.warn("Falling back to static Unsplash attribution:", err);
      }
    }

    // Fallback: static attribution details supplied in configuration.
    renderAttributionMarkup(photographerName, photographerUrl, photoUrl, unsplashUrl);
  }

  // ---- Settings overlay -------------------------------------------------
  // Items are persisted via the existing appState storage under this key.
  // Each item is stored as { id, text }; a separate key tracks which item id
  // is the current "default" item.
  const SETTINGS_STORAGE_KEY = 'settingsListItems';
  const SETTINGS_DEFAULT_KEY = 'settingsDefaultItemId';
  const SWIPE_REVEAL_PX = 84;
  const SWIPE_OPEN_THRESHOLD_PX = 40;
  const SWIPE_DRAG_THRESHOLD_PX = 5;

  function generateSettingsItemId() {
    if (window.crypto && typeof window.crypto.randomUUID === 'function') {
      return window.crypto.randomUUID();
    }
    return 'id-' + Date.now() + '-' + Math.random().toString(36).slice(2);
  }

  async function getSettingsItems() {
    const items = await appState.get(SETTINGS_STORAGE_KEY, []);
    return Array.isArray(items) ? items : [];
  }

  async function saveSettingsItems(items) {
    await appState.set(SETTINGS_STORAGE_KEY, items);
  }

  async function getDefaultItemId() {
    return await appState.get(SETTINGS_DEFAULT_KEY, null);
  }

  async function setDefaultItemId(id) {
    await appState.set(SETTINGS_DEFAULT_KEY, id);
  }

  function closeAllSwipedItems(except) {
    document.querySelectorAll('.settings-item-content.swiped').forEach((el) => {
      if (el !== except) {
        el.classList.remove('swiped');
        el.style.transform = '';
      }
    });
  }

  function attachSwipeToDelete(contentEl, onDragStart) {
    let dragging = false;
    let startX = 0;
    let baseX = 0;

    function clampX(x) {
      return Math.max(-SWIPE_REVEAL_PX, Math.min(0, x));
    }

    contentEl.addEventListener('pointerdown', (event) => {
      dragging = true;
      startX = event.clientX;
      baseX = contentEl.classList.contains('swiped') ? -SWIPE_REVEAL_PX : 0;
      contentEl.style.transition = 'none';
      contentEl.setPointerCapture(event.pointerId);
    });

    contentEl.addEventListener('pointermove', (event) => {
      if (!dragging) return;
      const delta = event.clientX - startX;
      if (Math.abs(delta) > SWIPE_DRAG_THRESHOLD_PX && onDragStart) {
        onDragStart();
      }
      const next = clampX(baseX + delta);
      contentEl.style.transform = `translateX(${next}px)`;
    });

    function endDrag() {
      if (!dragging) return;
      dragging = false;
      contentEl.style.transition = '';

      const match = /translateX\((-?\d+(?:\.\d+)?)px\)/.exec(contentEl.style.transform);
      const finalX = match ? parseFloat(match[1]) : 0;

      if (finalX <= -SWIPE_OPEN_THRESHOLD_PX) {
        contentEl.style.transform = `translateX(-${SWIPE_REVEAL_PX}px)`;
        contentEl.classList.add('swiped');
        closeAllSwipedItems(contentEl);
      } else {
        contentEl.style.transform = '';
        contentEl.classList.remove('swiped');
      }
    }

    contentEl.addEventListener('pointerup', endDrag);
    contentEl.addEventListener('pointercancel', endDrag);
  }

  function renderSettingsList(items, defaultId) {
    const list = document.getElementById('settings-listbox');
    list.innerHTML = '';

    if (items.length === 0) {
      const empty = document.createElement('li');
      empty.className = 'settings-empty';
      empty.textContent = 'No items yet.';
      list.appendChild(empty);
      return;
    }

    items.forEach((item) => {
      const isDefault = item.id === defaultId;

      const li = document.createElement('li');
      li.className = 'settings-item';

      const content = document.createElement('div');
      content.className = 'settings-item-content';

      const tick = document.createElement('span');
      tick.className = 'settings-item-tick';
      tick.textContent = isDefault ? '\u2713' : '';

      const textSpan = document.createElement('span');
      textSpan.className = 'settings-item-text';
      textSpan.textContent = item.text;

      content.appendChild(tick);
      content.appendChild(textSpan);

      let wasDragged = false;

      content.addEventListener('click', async () => {
        if (wasDragged) {
          wasDragged = false;
          return;
        }
        if (content.classList.contains('swiped')) {
          content.classList.remove('swiped');
          content.style.transform = '';
          return;
        }
        await setDefaultItemId(item.id);
        closeSettingsModal();
      });

      // The default item has no delete affordance: no swipe, no delete button.
      if (!isDefault) {
        const deleteBtn = document.createElement('button');
        deleteBtn.className = 'settings-item-delete';
        deleteBtn.textContent = 'Delete';
        deleteBtn.addEventListener('click', async (event) => {
          event.stopPropagation();
          const currentItems = await getSettingsItems();
          const filtered = currentItems.filter((i) => i.id !== item.id);
          await saveSettingsItems(filtered);
          const currentDefaultId = await getDefaultItemId();
          renderSettingsList(filtered, currentDefaultId);
        });
        li.appendChild(deleteBtn);
        attachSwipeToDelete(content, () => { wasDragged = true; });
      }

      li.appendChild(content);
      list.appendChild(li);
    });
  }

  async function loadSettingsList() {
    const items = await getSettingsItems();
    const defaultId = await getDefaultItemId();
    renderSettingsList(items, defaultId);
  }

  function openSettingsModal() {
    document.getElementById('settings-modal-overlay').classList.add('open');
    loadSettingsList();
  }

  function closeSettingsModal() {
    document.getElementById('settings-modal-overlay').classList.remove('open');
  }

  document.getElementById('settings-gear-btn').addEventListener('click', openSettingsModal);
  document.getElementById('settings-close-btn').addEventListener('click', closeSettingsModal);
  document.getElementById('settings-modal-overlay').addEventListener('click', closeSettingsModal);
  // Clicks inside the panel (listbox, input, buttons) must not bubble up
  // to the overlay's click-to-close handler.
  document.getElementById('settings-panel').addEventListener('click', (event) => {
    event.stopPropagation();
  });

  document.getElementById('settings-refresh-btn').addEventListener('click', (event) => {
    event.stopPropagation();

    // Ask the active service worker to purge and re-populate its cache.
    if (navigator.serviceWorker && navigator.serviceWorker.controller) {
      console.log(navigator.serviceWorker.controller);
      navigator.serviceWorker.controller.postMessage({ type: 'PURGE_AND_RECACHE' });
    }

    closeSettingsModal();
    //window.location.reload();
  });

  navigator.serviceWorker.addEventListener('message', (event) => {
      if (event.data && event.data.type === 'REFRESH_APP') {
         console.log('App refreshed');
         window.location.reload(); 
      }
  });
  const settingsInput = document.getElementById('settings-new-item');
  const settingsAddBtn = document.getElementById('settings-add-btn');

  settingsInput.addEventListener('input', () => {
    settingsAddBtn.disabled = settingsInput.value.trim() === '';
  });

  settingsAddBtn.addEventListener('click', async () => {
    const text = settingsInput.value.trim();
    if (!text) return;

    const items = await getSettingsItems();
    const newItem = { id: generateSettingsItemId(), text };
    items.push(newItem);
    await saveSettingsItems(items);

    // The very first item ever added becomes the default.
    let defaultId = await getDefaultItemId();
    if (!defaultId) {
      defaultId = newItem.id;
      await setDefaultItemId(defaultId);
    }

    settingsInput.value = '';
    settingsAddBtn.disabled = true;

    renderSettingsList(items, defaultId);
  });

  navigator.serviceWorker.addEventListener('controllerchange', () => {
    console.log('Service worker has taken control!');
    // Re-run any setup logic that depends on navigator.serviceWorker.controller
  });
  // ------------------------------------------------------------------------

  async function init(configUrl) {
    // register service worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => console.log('Service Worker registered!', reg))
          .catch(err => console.error('Registration failed:', err));
      });
    }

    const statusEl = document.getElementById("status-message");
    try {
      const response = await fetch(configUrl, { cache: "force-cache" });
      if (!response.ok) {
        throw new Error(`Failed to load ${configUrl}: ${response.status}`);
      }
      const config = await response.json();
      setTitle(config.title);
      applyBackground(config.backgroundImage);
      applyLuminosity(config.backgroundLuminosity);
      renderLinks(Array.isArray(config.links) ? config.links : []);
      await loadAttribution(config.backgroundAttribution);
    } catch (err) {
      console.error(err);
      statusEl.textContent = "Couldn't load configuration [" + configName + "].";
    }
  }

  const appState = new self.AppState();

  (async () => {
    const queryString = window.location.search;
    const urlParams = new URLSearchParams(queryString);
    let configName = urlParams.get('cfg');
    if (!configName) {
      configName = await appState.get('cfg', DEFAULT_CONFIG_NAME);
    }
    const configUrl = CONFIG_DIR + '/' + configName + '.json';
    init(configUrl);
  })()

</script>

</body>
